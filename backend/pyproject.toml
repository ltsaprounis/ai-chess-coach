[project]
name = "chess-coach"
version = "0.1.0"
description = "chess.com game analysis with Stockfish and LLM coaching"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
# Direct dependencies are pinned exactly: uv.lock is per-machine
# (gitignored, see the repo .gitignore), so these pins are what makes
# fresh clones and CI reproduce the tested direct-dependency set.
dependencies = [
    "claude-agent-sdk==0.2.126",
    # GPLv3+ and imported directly, so the assembled app is a combined
    # work under the GPL. That is now the project's own license too
    # (GPL-3.0-or-later, matching upstream), so there is nothing latent
    # left here — the label states what the combination already was.
    # Keep it that way: a permissive relicense would need this
    # dependency gone first. (Stockfish is a subprocess, so it stays a
    # separate work regardless.)
    "chess==1.11.2",
    "fastapi==0.139.2",
    "github-copilot-sdk==1.0.8",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "sse-starlette==3.4.6",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "import-linter==2.13",
    "pip-audit==2.10.1",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
    "types-pyyaml==6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_coach"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "engine: needs a built Stockfish binary (run with: pytest -m engine)",
]
addopts = "-m 'not engine'"
asyncio_mode = "auto"

[tool.importlinter]
# Note: the cache location is a CLI concern — see `make check` and
# ci.yml, which pass --cache-dir .cache/import_linter.
root_package = "chess_coach"

[[tool.importlinter.contracts]]
name = "components never import each other"
type = "independence"
modules = [
    "chess_coach.config",
    "chess_coach.ingestion",
    "chess_coach.storage",
    "chess_coach.engine",
    "chess_coach.openings",
    "chess_coach.coach",
]

[[tool.importlinter.contracts]]
name = "only api composes; domain is the base layer"
type = "layers"
layers = [
    "chess_coach.api",
    "chess_coach.config | chess_coach.ingestion | chess_coach.storage | chess_coach.engine | chess_coach.openings | chess_coach.coach",
    "chess_coach.domain",
]
