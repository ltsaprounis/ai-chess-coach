[project]
name = "chess-coach"
version = "0.1.0"
description = "chess.com game analysis with Stockfish and LLM coaching"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1",
    # GPLv3+ and imported directly, so it makes the backend a combined
    # work under the GPL. Latent — only an issue if we DISTRIBUTE the
    # backend (then GPL it or replace this). Hosted-only is fine: it's
    # GPL, not AGPL. (Stockfish runs as a subprocess, so it's separate.)
    "chess>=1.11",
    "fastapi>=0.115",
    "github-copilot-sdk>=1.0.8",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_coach"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "engine: needs a built Stockfish binary (run with: pytest -m engine)",
]
addopts = "-m 'not engine'"
asyncio_mode = "auto"

[tool.importlinter]
# Note: the cache location is a CLI concern — see `make check` and
# ci.yml, which pass --cache-dir .cache/import_linter.
root_package = "chess_coach"

[[tool.importlinter.contracts]]
name = "components never import each other"
type = "independence"
modules = [
    "chess_coach.config",
    "chess_coach.ingestion",
    "chess_coach.storage",
    "chess_coach.engine",
    "chess_coach.openings",
    "chess_coach.coach",
]

[[tool.importlinter.contracts]]
name = "only api composes; domain is the base layer"
type = "layers"
layers = [
    "chess_coach.api",
    "chess_coach.config | chess_coach.ingestion | chess_coach.storage | chess_coach.engine | chess_coach.openings | chess_coach.coach",
    "chess_coach.domain",
]
