repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        # Must run with backend/ as the working directory (like `make
        # check`): --project only selects the venv, so from the repo
        # root pyright never finds backend/pyproject.toml's scope and
        # scans the whole tree — including the Stockfish submodule's
        # test scripts, which fail strict mode.
        entry: bash -c 'cd backend && uv run pyright'
        language: system
        types: [python]
        pass_filenames: false
