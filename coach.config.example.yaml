# AI Chess Coach configuration. Copy to coach.config.yaml and edit.
# Every key is optional; omitted keys use the defaults shown here.
# Secrets never go in this file. Nothing needs one today: both coach
# providers ride a local CLI login.

engine:
  depth: 16        # Stockfish search depth per position
  workers: 2       # parallel engine processes
  analyze_limit: 100   # max games per "analyze" run (newest first)
  multipv: 5       # candidate lines for live eval and the coach's
                   # engine tool (1-10); batch analysis stays single-PV
  eval_timeout: 300.0  # seconds capping each position search and the
                   # gap between streamed infos; tripping it means a
                   # wedged engine worker that the pool kills and retires
  # bin_path: engines/stockfish/src/stockfish   # default: submodule build

thresholds:        # centipawn loss per judgment
  inaccuracy: 50
  mistake: 100
  blunder: 200

# brilliant:         # sound-sacrifice cutoffs for the coach's
#                    # blunders/brilliant-moves highlights (see
#                    # docs/06-coach.md, "Highlights")
#   sac_points: 2        # min material (SEE, pawn units) given up
#   best_tolerance_cp: 0  # max cp_loss to still count as engine-best
#   winning_cap_cp: 200   # eval before the move must be <= this
#                         # (player POV): not already winning
#   sound_floor_cp: 0     # eval after the move must be >= this
#                         # (player POV): still sound afterwards

# coach:            # roster of selectable coaches shown in the UI
#   # Two providers: claude-agent-sdk rides your Claude Code login,
#   # github-copilot rides your GitHub Copilot CLI login.
#   agents:
#     - id: claude
#       label: Claude
#       provider: claude-agent-sdk
#       model: claude-opus-4-8
#     - id: copilot
#       label: Copilot
#       provider: github-copilot
#       # Any id your Copilot plan serves; rosters drift over time,
#       # so list yours with the SDK's client.list_models().
#       model: gpt-5.6-sol
#   default_agent: claude   # default: the first agent's id

server:
  port: 8000       # .claude/launch.json hardcodes this port for the
                   # browser-preview launcher; change both together

storage:
  db_path: data/coach.sqlite3   # repo-root relative; created on demand

